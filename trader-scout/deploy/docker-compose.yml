# Dev tracker + PostgreSQL (B6). From trader-scout/:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Keys come from ../.env (SCOUT_<CHAIN>_RPC_URL, SCOUT_<CHAIN>_FALLBACK_RPC_URL,
# SCOUT_HELIUS_API_KEY, SCOUT_CODEX_API_KEY, SCOUT_TELEGRAM_BOT_TOKEN,
# SCOUT_TELEGRAM_CHAT_ID). Edit ../config/dev-tracker.toml (copy of the
# example) — it is re-read every cycle, no restart needed.
name: trader-scout-devtracker

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${SCOUT_DEVTRACKER_DB_PASSWORD:-scout}
      POSTGRES_DB: scout
    volumes:
      - devtracker-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d scout"]
      interval: 10s
      retries: 6

  dev-tracker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ../.env
    environment:
      SCOUT_DEVTRACKER_DATABASE_URL: postgres://scout:${SCOUT_DEVTRACKER_DB_PASSWORD:-scout}@db:5432/scout
    volumes:
      - ../config/dev-tracker.toml:/app/config/dev-tracker.toml:ro
      - ../exports:/app/exports
    stop_grace_period: 60s

volumes:
  devtracker-pg:
