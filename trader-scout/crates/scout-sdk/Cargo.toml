[package]
name = "scout-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["scan"]
scan = ["dep:scout-scan", "dep:scout-evm", "dep:scout-solana", "dep:scout-providers"]
ledger = ["scan", "dep:scout-normalize", "dep:scout-ledger"]
analytics = ["ledger", "dep:scout-analytics"]
full = ["analytics", "dep:scout-storage", "dep:scout-engine"]
# ADR-008: Tier 2 (NormalizedActivitySource / ExternalDataOptIn) is a
# second, independent barrier alongside the ExternalDataOptIn token
# itself. Off by default — a consumer must explicitly opt in at the
# Cargo.toml level before scout-sdk::external_data even compiles,
# regardless of whether the composition root later constructs a token.
external-data = ["dep:scout-api"]

[dependencies]
scout-core.workspace = true
scout-scan = { workspace = true, optional = true }
scout-evm = { workspace = true, optional = true }
scout-solana = { workspace = true, optional = true }
scout-providers = { workspace = true, optional = true }
scout-normalize = { workspace = true, optional = true }
scout-ledger = { workspace = true, optional = true }
scout-analytics = { workspace = true, optional = true }
scout-storage = { workspace = true, optional = true }
scout-engine = { workspace = true, optional = true }
scout-api = { workspace = true, optional = true }

[dev-dependencies]
# Only for examples/embedded_scanner.rs, which proves the scan-feature
# surface embeds into an existing Tokio application (ROADMAP.md P8.1,
# ACCEPTANCE F07) — never part of the library's own public dependency
# graph, per AGENTS.md invariant #15 (SDK does not create its own
# runtime for library consumers; the example's #[tokio::main] stands in
# for a HOST application's runtime, not scout-sdk's).
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-util.workspace = true
futures.workspace = true
