# Dev tracker configuration (docs/DEV-TRACKER.md). Re-read every cycle:
# edits apply without a restart. Money in whole USD, time in days.

# A launch younger than this that has not migrated is "pending": it is neither
# a failure nor a streak breaker until the window expires.
pending_window_days = 3

# Launchpads with no bonding curve (no migration rate): their devs can only
# qualify for top-runners (owner decision 2026-10-06).
launchpads_without_migration = ["zora", "clanker", "doppler", "bankr", "noice", "flaunch"]

[top_runners]
runner_ath_usd = 500000          # a "runner" token
big_runner_ath_usd = 1000000     # at least one big runner …
min_big_runners = 1
min_other_runners = 2            # … plus this many further runners
# ATH above this is treated as implausible (manipulated price on a huge
# supply) and never makes a runner; the observation is kept as is.
max_plausible_ath_usd = 10000000000
# A runner also needs this many holders (Codex): one tiny trade in an empty
# pool can show a multi-million ATH (Zora coins with 1-8 holders at $1.4M-$99M).
min_holders = 100
# Launchpads whose ATH FDV can be a supply artifact (Bankr tokens at $380M-$6B
# with $0-$3.5k liquidity): a runner there also needs the highest liquidity seen
# to be at least this share of its ATH (basis points, 100 = 1 %).
liquidity_checked_launchpads = ["bankr", "noice"]
min_liquidity_bp_of_ath = 100
min_migration_rate_pct = 3       # skipped for launchpads without migration
max_inactive_days = 365          # last launch no older than this

[top_migr]
min_migration_rate_pct = 80
min_launches = 3                 # resolved launches (pending excluded)
max_inactive_days = 365

[win_streak]
# only devs that are in neither of the two lists above
min_streak = 3                   # consecutive migrated launches, newest first
max_inactive_days = 365

[schedule]
# Daemon (`dev-tracker run`) cadence and per-pass budgets.
chains = ["solana", "bsc", "base", "robinhood"]
ingest_every_minutes = 30        # launches, migrations, dev identities, ATH
derive_every_minutes = 60        # categories + delivery
start_hours_back = 24            # where a source without a cursor starts
ath_requests_per_chain = 20      # Codex, 200 tokens each (free tier: 10k/month)
solana_max_pages = 200           # Helius pages of ≤ 1000 txs per source and pass
max_new_creators = 2000          # EVM creators classified per chain and pass
max_signer_lookups = 5000        # launch signers resolved per chain and pass
max_dev_histories = 500          # candidate devs whose history is fetched per chain and pass
since_days = 365                 # launches loaded for the derivation

[delivery]
# One file per category × chain × format; sent only when the list's wallets change.
formats = ["gmgn", "axiom", "basedbot"]
chains = ["solana", "bsc", "base", "robinhood"]
max_wallets_per_file = 500       # best-ranked first; GMGN tracks at most 2,000
out_dir = "exports"              # current files are also written here ("" = off)
telegram = true                  # needs SCOUT_TELEGRAM_BOT_TOKEN and SCOUT_TELEGRAM_CHAT_ID

[alerts]
# Telegram messages (same bot/chat as delivery): daemon start / stop, a restart
# after an unclean stop (crash, kill, power loss — seen through a liveness beat),
# and incidents: a chain's pass, Helius (Solana running on its fallback), the
# derivation or the export failing for `after_minutes` is alerted ONCE, and its
# recovery once — never on every failing pass.
enabled = true
after_minutes = 30
