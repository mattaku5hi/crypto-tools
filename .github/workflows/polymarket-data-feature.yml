name: Shared Polymarket adapter
env:
  CARGO_TERM_COLOR: never
on:
  push:
    branches: [feat/p0-p1-foundation]
    paths: ['polymarket-data/**', '.github/workflows/polymarket-data-feature.yml']
jobs:
  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polymarket-data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: |
          if cargo clippy --locked --all-targets --all-features -- -D warnings > clippy.log 2>&1; then
            cat clippy.log
          else
            cat clippy.log
            python3 - <<'PYCODE'
          from pathlib import Path
          import re
          text = re.sub(r"\x1b\[[0-9;]*[mK]", "", Path("clippy.log").read_text())
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith("error"):
                  message = "\n".join(lines[i:i + 10])[:2000]
                  message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error::{message}")
          PYCODE
            exit 1
          fi
      - run: cargo test --locked --all-features
  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polymarket-data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --no-default-features --features streams,gamma
